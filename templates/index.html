<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokengue</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #E3350D;
      --dark: #1a1a2e;
      --yellow: #FFCB05;
      --blue: #3B4CCA;
      --white: #f5f5f5;
      --card-bg: #16213e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--dark);
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(59,76,202,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(227,53,13,0.15) 0%, transparent 60%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .pokeball {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--red) 50%, var(--white) 50%);
      border: 5px solid #111;
      position: relative;
      margin: 0 auto 2rem;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(227,53,13,0.4);
    }

    .pokeball::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 6px;
      background: #111;
    }

    .pokeball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--white);
      border: 5px solid #111;
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.2rem;
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--red), -1px -1px 0 #111;
      letter-spacing: 2px;
      margin-bottom: 1.2rem;
      animation: fadeDown 0.8s ease both;
    }

    .subtitle {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      color: #d4cdb8;
      letter-spacing: 0.8px;
      text-align: center;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
      margin-top: 0.8rem;
      margin-bottom: 3rem;
      line-height: 1.3;
      animation: fadeDown 0.8s 0.2s ease both;
    }

    .deco-star {
      display: inline-block;
      color: var(--red);
      font-size: 1.2rem;
      margin: 0 0.8rem;
      vertical-align: middle;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    }

    .db-grid {
      display: flex;
      gap: 1.6rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeDown 0.8s 0.4s ease both;
    }

    .db-card {
      background: var(--card-bg);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem 1.9rem;
      width: 220px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: default;
    }

    .db-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .db-card.mongo:hover  { border-color: #22c55e; box-shadow: 0 8px 30px #22c55e66; }
    .db-card.neo4j:hover  { border-color: #ec4899; box-shadow: 0 8px 30px #ec489966; }
    .db-card.cass:hover   { border-color: #a855f7; box-shadow: 0 8px 30px #a855f766; }
    .db-card.redis:hover  { border-color: #3b82f6; box-shadow: 0 8px 30px #3b82f666; }

    .db-icon { font-size: 2.6rem; margin-bottom: 0.7rem; }
    .db-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: var(--yellow);
      margin-bottom: 0.7rem;
      text-align: center;
    }
    .db-desc {
      font-size: 1.15rem;
      color: #888;
      line-height: 1.5;
      text-align: center;
    }

    .demo-link {
      display: block;
      color: var(--red);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      margin-top: 1.2rem;
      text-align: center;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* La tarjeta de Neo4j es un link a la demo (las demás siguen siendo divs) */
    a.db-card { text-decoration: none; color: inherit; cursor: pointer; }

    .db-card.mongo .db-icon {
      display: inline-block;
      transform-origin: bottom center;
      animation: brillo-mongo 2s ease-in-out infinite;
    }
    @keyframes brillo-mongo {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 0 transparent); transform: rotate(-5deg); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 6px #22c55eaa); transform: rotate(5deg); }
    }

    .db-card.neo4j .db-icon {
      display: inline-block;
      transform-origin: center;
      animation: brillo-neo 2s ease-in-out infinite;
    }
    @keyframes brillo-neo {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 0 transparent); transform: scale(1); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 6px #ec4899aa); transform: scale(1.05); }
    }

    .db-card.cass .db-icon {
      display: inline-block;
      animation: brillo-cass 2s ease-in-out infinite;
    }
    @keyframes brillo-cass {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 0 transparent); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 6px #a855f7aa); }
    }

    .db-card.redis .db-icon {
      display: inline-block;
      animation: brillo-redis 2s ease-in-out infinite;
    }
    @keyframes brillo-redis {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 0 transparent); transform: rotate(-3deg); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 6px #3b82f6aa); transform: rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .db-icon,
      .db-card.neo4j .db-icon svg,
      .pokeball,
      .estado-neo4j,
      .estado-neo4j.ok,
      .estado-neo4j.error { animation: none !important; }
      .estado-neo4j { opacity: 1 !important; }
    }

    .estado-neo4j {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #9aa0a6;
      color: #d0d4d9;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      animation: fadeInBadge 0.6s 0.3s ease-out forwards;
      transition: border-color 0.3s, color 0.3s;
    }
    @keyframes fadeInBadge {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .estado-neo4j.ok {
      border-color: #22c55e; color: #4ade80;
      animation: fadeInBadge 0.6s 0.3s ease-out forwards, brillo-ok 2s ease-in-out infinite;
    }
    @keyframes brillo-ok {
      0%, 100% { box-shadow: 0 4px 16px rgba(34, 197, 94, 0.2); }
      50%      { box-shadow: 0 4px 24px rgba(34, 197, 94, 0.6); }
    }
    .estado-neo4j.error {
      border-color: #ef4444; color: #f87171;
      animation: fadeInBadge 0.6s 0.3s ease-out forwards, brillo-error 2s ease-in-out infinite;
    }
    @keyframes brillo-error {
      0%, 100% { box-shadow: 0 4px 16px rgba(239, 68, 68, 0.2); }
      50%      { box-shadow: 0 4px 24px rgba(239, 68, 68, 0.6); }
    }
    .estado-neo4j.cambio {
      animation: destello-cambio 1s ease-out;
    }
    @keyframes destello-cambio {
      0%   { transform: scale(1); }
      20%  { transform: scale(1.15); box-shadow: 0 0 30px currentColor; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pokeball"></div>
    <h1>Pokengue</h1>
    <p class="subtitle">
      <span class="deco-star">✦</span>
      Proyecto integrador de bases de datos NoSQL
      <span class="deco-star">✦</span>
    </p>

    <div class="db-grid">
      <a href="/mongo" class="db-card mongo">
        <div class="db-icon">🍃</div>
        <div class="db-name">MongoDB</div>
        <div class="db-desc">Datos generales de Pokémon</div>
        <div class="demo-link">VER DEMO</div>
      </a>
      <a href="/neo4j" class="db-card neo4j">
        <div class="db-icon">🕸️</div>
        <div class="db-name">Neo4J</div>
        <div class="db-desc">Red social Pokémon</div>
        <div class="demo-link">VER DEMO</div>
      </a>
      <a href="/cassandra" class="db-card cass">
        <div class="db-icon">💎</div>
        <div class="db-name">Cassandra</div>
        <div class="db-desc">Historial de batallas</div>
        <div class="demo-link">VER DEMO</div>
      </a>
      <a href="/redis" class="db-card redis">
        <div class="db-icon">⚡</div>
        <div class="db-name">Redis</div>
        <div class="db-desc">Sesiones y caché</div>
        <div class="demo-link">VER DEMO</div>
      </a>
    </div>
  </div>

  <div id="estadoNeo4j" class="estado-neo4j">⏳ Neo4j…</div>

  <script>
    (function () {
        const el = document.getElementById('estadoNeo4j');
        let estadoAnterior = null;

        async function consultarEstado() {
            try {
                const resp = await fetch('/neo4j/estado');
                const r = await resp.json();
                const nuevoEstado = r.ok ? 'ok' : 'error';
                const texto = r.ok ? '🟢 Neo4j conectado' : '🔴 Neo4j desconectado';

                if (estadoAnterior !== null && estadoAnterior !== nuevoEstado) {
                    el.classList.add('cambio');
                    setTimeout(() => el.classList.remove('cambio'), 1000);
                }

                el.textContent = texto;
                el.classList.remove('ok', 'error');
                el.classList.add(nuevoEstado);
                estadoAnterior = nuevoEstado;
            } catch (e) {
                const nuevoEstado = 'error';
                if (estadoAnterior !== null && estadoAnterior !== nuevoEstado) {
                    el.classList.add('cambio');
                    setTimeout(() => el.classList.remove('cambio'), 1000);
                }
                el.textContent = '🔴 Neo4j desconectado';
                el.classList.remove('ok');
                el.classList.add('error');
                estadoAnterior = nuevoEstado;
            }
        }

        consultarEstado();

        let intervalId = setInterval(consultarEstado, 5000);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(intervalId);
                intervalId = null;
            } else if (intervalId === null) {
                consultarEstado();
                intervalId = setInterval(consultarEstado, 5000);
            }
        });
    })();
  </script>
</body>
</html>
