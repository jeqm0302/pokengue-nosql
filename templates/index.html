<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokengue</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #E3350D;
      --dark: #1a1a2e;
      --yellow: #FFCB05;
      --blue: #3B4CCA;
      --white: #f5f5f5;
      --card-bg: #16213e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--dark);
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(59,76,202,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(227,53,13,0.15) 0%, transparent 60%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .pokeball {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--red) 50%, var(--white) 50%);
      border: 5px solid #111;
      position: relative;
      margin: 0 auto 2rem;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(227,53,13,0.4);
    }

    .pokeball::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 6px;
      background: #111;
    }

    .pokeball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--white);
      border: 5px solid #111;
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.2rem;
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--red), -1px -1px 0 #111;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      animation: fadeDown 0.8s ease both;
    }

    .subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 3rem;
      animation: fadeDown 0.8s 0.2s ease both;
    }

    .db-grid {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeDown 0.8s 0.4s ease both;
    }

    .db-card {
      background: var(--card-bg);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      width: 140px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: default;
    }

    .db-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .db-card.mongo:hover  { border-color: #4DB33D; box-shadow: 0 8px 24px rgba(77,179,61,0.3); }
    .db-card.neo4j:hover  { border-color: #008CC1; box-shadow: 0 8px 24px rgba(0,140,193,0.3); }
    .db-card.cass:hover   { border-color: #1287B1; box-shadow: 0 8px 24px rgba(18,135,177,0.3); }
    .db-card.redis:hover  { border-color: #D82C20; box-shadow: 0 8px 24px rgba(216,44,32,0.3); }

    .db-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .db-name { font-family: 'Press Start 2P', monospace; font-size: 0.5rem; color: var(--yellow); margin-bottom: 0.3rem; }
    .db-desc { font-size: 0.72rem; color: #888; line-height: 1.4; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pokeball"></div>
    <h1>Pokengue</h1>
    <p class="subtitle">Proyecto integrador de bases de datos NoSQL</p>

    <div class="db-grid">
      <div class="db-card mongo">
        <div class="db-icon">🍃</div>
        <div class="db-name">MongoDB</div>
        <div class="db-desc">Datos generales de Pokémon</div>
      </div>
      <div class="db-card neo4j">
        <div class="db-icon">🕸️</div>
        <div class="db-name">Neo4J</div>
        <div class="db-desc">Relaciones y evoluciones</div>
      </div>
      <div class="db-card cass">
        <div class="db-icon">💎</div>
        <div class="db-name">Cassandra</div>
        <div class="db-desc">Historial de batallas</div>
      </div>
      <div class="db-card redis">
        <div class="db-icon">⚡</div>
        <div class="db-name">Redis</div>
        <div class="db-desc">Sesiones y caché</div>
      </div>
    </div>
  </div>
</body>
</html>
